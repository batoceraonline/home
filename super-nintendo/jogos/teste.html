<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste Local - Batocera Online</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #game { width: 100vw; height: 100vh; }
        #top { position: absolute; top: 10px; width: 100%; text-align: center; pointer-events: none; }
    </style>
</head>
<body>

    <div id="top">
        <h1>Teste de ROM Local</h1>
        <p>Carregando jogo a partir do servidor próprio...</p>
    </div>

    <div id="game"></div>

    <script type='text/javascript'>
        // Configurações do EmulatorJS
        EJS_player = '#game';
        EJS_core = 'snes'; // Altere se o jogo for de outro console
        EJS_lightgun = false;
        EJS_color = "#0097c4";
        EJS_backgroundColor = "#000";
        
        // Caminho local para o seu arquivo
        EJS_gameUrl = 'teste.zip'; 
        
        // Caminho CDN para o loader do emulador
        EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';
        
        EJS_startOnLoaded = true;
    </script>
    
    <!-- O script do loader deve vir depois da configuração -->
    <script src='https://cdn.emulatorjs.org/latest/data/loader.js'></script>
</body>
</html>
