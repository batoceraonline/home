<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Super Mario World - SNES | Batocera Online</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="imagem/favicon.png">
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://cdn.emulatorjs.org">
</head>

<body>
    <div id="top">
        <header>
            <img src="../imagem/logo.png" alt="Logo" class="logo">
            <nav>
                <ul>
                    <li><a href="../../">Início</a></li>
                    <li><a href="../../emulador">Use Sua Rom</a></li>
                </ul>
            </nav>
        </header>
        <h1>Super Mario World - Super Nintendo</h1>
    </div>

    <div id="game-container" style="width: 100%; max-width: 800px; height: 600px; margin: 0 auto;">
        <div id="game"></div>
    </div>

    <script type='text/javascript'>
        // Configurações otimizadas
        var EJS_player = '#game';
        var EJS_core = 'snes'; // O EmulatorJS já usa WebAssembly internamente para SNES
        var EJS_gameUrl = '/roms/Super Mario World (USA).zip';
        var EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';
        
        // Melhora a performance desativando recursos desnecessários
        var EJS_startOnLoaded = true;
        var EJS_DEBUG_XX = false;
        var EJS_AdUrl = ''; // Garante que não tente carregar ads externos
        
        // Função de tela cheia disparada por clique (navegadores modernos bloqueiam onload)
        function startFullscreen() {
            let elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen();
        }
    </script>

    <script async src='../../data/loader.js'></script>
</body>
</html>
